name: 构建 / 发版 anabranch-core

# 本仓库唯一的发版口。只能手动触发（workflow_dispatch）：
#
#   - 不勾 release：gradle build + publishToMavenLocal，把 jar / sources / javadoc /
#     POM 的完整 Maven 布局（未签名）塞进 artifact——不装 Gradle 也能取构件。
#   - 勾 release：导入 GPG 私钥 → gradle centralBundle（签名 + 校验和 + zip）→
#     上传 Central Portal 并轮询校验结果 → 打 v<版本> tag。默认 USER_MANAGED：
#     Portal 校验通过后停在那里等维护者点 Publish（那一步之后就撤不回）；再勾
#     auto_publish 才让 Portal 校验通过后自动发布。
#   - include_aria2：先在同一次 run 里跑一遍「构建 libaria2」（约 12 分钟）现编
#     AAR，再把它一并打进 bundle 发布为 anabranch-aria2；aria2_slim 选裁剪版。
#
# 「不做自动发版」的边界在这里的含义：没有任何 push/tag 事件能触发发布，发布只
# 来自一个人的一次有意识的勾选。需要的 secrets 见 docs/RELEASING.md §四。
on:
  workflow_dispatch:
    inputs:
      release:
        description: '正式发版：签名 → 上传 Central Portal → 打 tag（不勾 = 只出未签名 artifact）'
        type: boolean
        default: false
      auto_publish:
        description: 'Portal 校验通过后自动 Publish（不勾 = 停在 Portal 等人工点，可撤回）'
        type: boolean
        default: false
      include_aria2:
        description: '连 anabranch-aria2 一起：本次 run 先交叉编译 libaria2 并组装 AAR（约 12 分钟）'
        type: boolean
        default: false
      aria2_slim:
        description: 'aria2 用裁剪构建（去 libxml2/SQLite/libssh2；不勾 = 全量已验证配方）'
        type: boolean
        default: false

permissions:
  contents: write   # 只有 release 打 tag 那一步用到；其余步骤只读

jobs:
  # 勾了 include_aria2 才跑：复用「构建 libaria2」整个 workflow，产物留在本 run。
  aria2:
    if: ${{ inputs.include_aria2 }}
    uses: ./.github/workflows/build-aria2.yml
    with:
      slim: ${{ inputs.aria2_slim }}

  build:
    name: ${{ inputs.release && '发版' || '构建' }}
    needs: [aria2]
    # aria2 job 被跳过（没勾）时也要跑；它失败或被取消时不跑。
    if: ${{ !cancelled() && needs.aria2.result != 'failure' && needs.aria2.result != 'cancelled' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # 仓库刻意不放 wrapper（CONTRIBUTING「构建系统只管发布」），Gradle 版本在
      # 这里钉死——与发布配置本地验证时用的是同一版。
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: 读取版本号
        run: |
          v="$(sed -n 's/^version = "\(.*\)"$/\1/p' build.gradle.kts)"
          [ -n "$v" ] || { echo "::error::build.gradle.kts 里读不到 version"; exit 1; }
          echo "VERSION=$v" >> "$GITHUB_ENV"
          echo "version=$v"

      - name: 发版前置核对
        if: ${{ inputs.release }}
        env:
          GPG_KEY: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
        run: |
          set -euo pipefail
          : "${GPG_KEY:?缺 secret MAVEN_GPG_PRIVATE_KEY（ASCII 装甲的私钥）}"
          : "${CENTRAL_USERNAME:?缺 secret CENTRAL_USERNAME（Portal 用户令牌的 username）}"
          : "${CENTRAL_PASSWORD:?缺 secret CENTRAL_PASSWORD（Portal 用户令牌的 password）}"
          case "$VERSION" in
            *-SNAPSHOT) echo "::error::版本号 $VERSION 带 -SNAPSHOT，Central 不收；先定版本再发"; exit 1 ;;
          esac
          if git ls-remote --tags origin "refs/tags/v${VERSION}" | grep -q .; then
            echo "::error::tag v${VERSION} 已存在——这个版本发过了，改版本号再来"; exit 1
          fi

      # ── 可选：取本 run 里刚编好的 AAR 一起发 ────────────────────────────
      - name: 取本 run 的 aria2 AAR
        if: ${{ inputs.include_aria2 }}
        uses: actions/download-artifact@v4
        with:
          name: libaria2-so${{ inputs.aria2_slim && '-slim' || '' }}
          path: aria2-artifact

      - name: 放置 aria2 AAR
        if: ${{ inputs.include_aria2 }}
        run: |
          set -euo pipefail
          aar="$(find aria2-artifact -name "anabranch-aria2-${VERSION}.aar" | head -1)"
          [ -n "$aar" ] || { echo "::error::artifact 里没有 anabranch-aria2-${VERSION}.aar（版本对不上？）"; exit 1; }
          mkdir -p aria2/dist && cp "$aar" aria2/dist/
          echo "AAR：$(sha256sum aria2/dist/*.aar)"

      # gradle build = 编译（--release 8）+ javadoc/sources jar + 三套 core 测试
      # 作为 check（与 run-checks.sh 同一批用例，core 边界检查在 checks.yml）。
      - name: gradle build
        run: gradle build

      # ── 不发版：未签名的 Maven 布局 ───────────────────────────────────
      - name: publishToMavenLocal（未签名）
        if: ${{ !inputs.release }}
        run: gradle publishToMavenLocal

      - name: 收集未签名产物
        if: ${{ !inputs.release }}
        run: |
          set -euo pipefail
          out=dist/anabranch-core-${VERSION}
          mkdir -p "$out/maven-repo/io/github"
          cp -r ~/.m2/repository/io/github/cybernova2333 "$out/maven-repo/io/github/"
          cp build/libs/anabranch-core-*.jar "$out/"
          ( cd "$out" && find . -type f ! -name SHA256SUMS.txt -exec sha256sum {} + | sort -k2 | tee SHA256SUMS.txt )

      # ── 发版：签名出包 → Portal → tag ────────────────────────────────
      - name: 导入 GPG 私钥
        if: ${{ inputs.release }}
        env:
          GPG_KEY: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          printf '%s\n' "$GPG_KEY" | gpg --batch --import
          fpr="$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr/{print $10; exit}')"
          [ -n "$fpr" ] || { echo "::error::导入后找不到私钥指纹"; exit 1; }
          echo "GPG_FPR=$fpr" >> "$GITHUB_ENV"
          echo "签名 key：$fpr"

      - name: gradle centralBundle（签名 + 校验和 + zip）
        if: ${{ inputs.release }}
        env:
          GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          gradle centralBundle \
            -Psigning.gnupg.executable=gpg \
            -Psigning.gnupg.keyName="$GPG_FPR" \
            -Psigning.gnupg.passphrase="$GPG_PASSPHRASE"
          mkdir -p dist
          cp build/central-bundle.zip "dist/anabranch-${VERSION}-central-bundle.zip"
          ( cd dist && sha256sum *.zip | tee SHA256SUMS.txt )
          unzip -l build/central-bundle.zip | grep -E '\.(pom|jar|aar|module)$' || true

      - name: 上传 Central Portal 并等校验
        if: ${{ inputs.release }}
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          AUTO_PUBLISH: ${{ inputs.auto_publish }}
        run: |
          set -euo pipefail
          token="$(printf '%s:%s' "$CENTRAL_USERNAME" "$CENTRAL_PASSWORD" | base64 -w0)"
          echo "::add-mask::$token"
          ptype=USER_MANAGED; [ "$AUTO_PUBLISH" = "true" ] && ptype=AUTOMATIC
          name="anabranch-${VERSION}"
          id="$(curl -fsS --retry 3 -X POST \
              -H "Authorization: Bearer $token" \
              -F "bundle=@build/central-bundle.zip" \
              "https://central.sonatype.com/api/v1/publisher/upload?name=${name}&publishingType=${ptype}")"
          echo "deployment id: $id（publishingType=$ptype）"
          echo "DEPLOYMENT_ID=$id" >> "$GITHUB_ENV"

          # 轮询：USER_MANAGED 等到 VALIDATED 即可（之后由人在 Portal 点 Publish）；
          # AUTOMATIC 等 PUBLISHED。FAILED 立刻红并把 Portal 的错误原样打出来。
          want=VALIDATED; [ "$ptype" = AUTOMATIC ] && want=PUBLISHED
          for i in $(seq 1 80); do
            sleep 15
            resp="$(curl -fsS --retry 3 -X POST -H "Authorization: Bearer $token" \
                    "https://central.sonatype.com/api/v1/publisher/status?id=${id}")"
            state="$(printf '%s' "$resp" | jq -r '.deploymentState')"
            echo "[$i] $state"
            case "$state" in
              FAILED)
                echo "::error::Portal 校验失败"; printf '%s\n' "$resp" | jq .; exit 1 ;;
              "$want"|PUBLISHED)
                printf '%s\n' "$resp" | jq '{deploymentState, purls}'
                echo "::notice::部署 $id 已到 $state。$( [ "$ptype" = USER_MANAGED ] && echo '到 central.sonatype.com → Deployments 点 Publish 才真正发布（也可在那里 Drop 撤回）。' )"
                exit 0 ;;
            esac
          done
          echo "::warning::等了 20 分钟仍是 $state；去 Portal 的 Deployments 页看进度（部署本身已提交，不会丢）"

      - name: 打 tag v${{ env.VERSION }}
        if: ${{ inputs.release }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v${VERSION}" -m "anabranch-core ${VERSION}（Central 部署 ${DEPLOYMENT_ID}）"
          git push origin "v${VERSION}"

      - name: 取本 run 的 aria2 对应源码包
        if: ${{ inputs.release && inputs.include_aria2 }}
        uses: actions/download-artifact@v4
        with:
          name: anabranch-aria2-corresponding-source${{ inputs.aria2_slim && '-slim' || '' }}
          path: dist

      # GitHub Release 是「对应源码」的指定存放处（GPLv3 §6(d)）：AAR 与它的
      # 对应源码包并列挂在同一个 Release 下，NOTICES 与 POM 都指向这里。
      # 只发 core 时也建 Release（挂签名 bundle 备查），版本锚点统一。
      - name: 建 GitHub Release
        if: ${{ inputs.release }}
        env:
          : ${{ github.token }}
          INCLUDE_ARIA2: ${{ inputs.include_aria2 }}
        run: |
          set -euo pipefail
          {
            echo "Maven Central：\`io.github.cybernova2333:anabranch-core:${VERSION}\`（Central 部署 ${DEPLOYMENT_ID}）"
            if [ "$INCLUDE_ARIA2" = "true" ]; then
              echo
              echo "anabranch-aria2：\`io.github.cybernova2333:anabranch-aria2:${VERSION}\`（AAR，GPL-3.0-or-later）。"
              echo "本 Release 附带其**对应源码包**（anabranch-aria2-*-corresponding-source*.tar.gz）：静态链接的全部上游 tarball + 该 commit 的胶水与构建脚本，见包内 README.txt 与 AAR 内 THIRD-PARTY-NOTICES.md。"
            fi
          } > release-notes.md
          assets=( "dist/anabranch-${VERSION}-central-bundle.zip" )
          if [ "$INCLUDE_ARIA2" = "true" ]; then
            assets+=( aria2/dist/*.aar dist/*-corresponding-source*.tar.gz )
          fi
          gh release create "v${VERSION}" --title "v${VERSION}" --notes-file release-notes.md "${assets[@]}"

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: anabranch-core-${{ env.VERSION }}${{ inputs.release && '' || '-unsigned' }}
          path: dist/
          if-no-files-found: error
          retention-days: ${{ inputs.release && 90 || 14 }}
